<!DOCTYPE html>
<html lang="en">

<!-- https://jsfiddle.net/bkL57x6p/7/ -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 404</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="panel">

        <div class="top_panel">
            <h1 class="marquee"><span class="id_hal">HAL</span><span class="id_404"> 404</span></h1>
            <p class="blinking-text">The page you’re looking for can’t be found.</p>
            <img class="eye_container" src="./media/hal_image_1.png">

        </div>            
        <div class="bottom_panel">
            <div class="container"> 
                <img class="image" src="./media/hp_image.png">
            </div>   

            <div class="final_panel">
                <audio controls autoplay>
                    <source src="./media/i_m_sorry_dave.mp3 " type="audio/mp3">
                    Your browser does not support the audio element.
                </audio> 
                <p class="hal_input">
                    Hal 404 search:
                    <br>
                    <textarea class="id_search" name="name_search" rows="2" cols="33">Find a topic on this site</textarea>
                </p>
            </div>               
        </div>

    </div>
        
    <div class="tw-01">
        <div class="tw-01__stage">
            <p class="tw-01__label">Status Message</p>
            <h2 class="tw-01__text">I'm sorry Dave</h2>
            <p class="tw-01__sub"> I'm afraid I can't do that! </p>
        </div>
    </div>







</body>
</html>
